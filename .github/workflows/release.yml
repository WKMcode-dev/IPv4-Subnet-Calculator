name: Publish v1.1.0 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists."
          else
            gh release create v1.1.0 --target "$GITHUB_SHA" --title "WKM Network v1.1.0" --notes "VLSM calculator, emerald theme, refined SVG cards and animated isometric IPv4 network illustration." --latest
          fi
